<!--
    Define que o documento é uma página HTML.
    O atributo lang informa o idioma da página.
    pt-br = Português do Brasil.
-->
<html lang="pt-br">

<!--
    A tag head guarda configurações da página.
    Essas informações não aparecem diretamente para o usuário.
-->
<head>

<!--
    Define o conjunto de caracteres utilizado.

    UTF-8 permite mostrar corretamente:
    - acentos;
    - símbolos;
    - caracteres especiais.

    Exemplo:
    á, ç, ã, é
-->
<meta charset="UTF-8">

<!--
    Configura a página para funcionar em diferentes dispositivos.

    width=device-width:
    usa a largura real da tela.

    initial-scale=1.0:
    inicia a página sem zoom.
    
    Importante para celulares e tablets.
-->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!--
    Define o texto que aparece na aba do navegador.
-->
<title>Banco InovaWeb</title>

<!--
    Faz a ligação do HTML com o arquivo CSS.

    rel="stylesheet":
    informa que o arquivo é uma folha de estilos.

    href="styles.css":
    caminho do arquivo responsável pela aparência.
-->
<link rel="stylesheet" href="styles.css">


<!--
    Início do conteúdo visual da página.
    Tudo dentro do body aparece para o usuário.
-->
<body>

<!--
    h1 representa o título principal da página.

    Normalmente existe apenas um h1 por página.

    Aqui mostra:
    Banco InovaWeb
-->
<h1>Banco InovaWeb</h1>

<!--
    Cria um bloco de organização.

    div é uma caixa genérica usada para agrupar elementos.

    class="container":
    permite aplicar estilos CSS.

    Exemplo:
    largura;
    espaçamento;
    alinhamento.
-->
<div class="container">



<!-- ================================================= -->
<!-- CARD DE SALDO -->
<!-- ================================================= -->

<!--
    Cria um cartão visual.

    A classe card será estilizada pelo CSS.

    Geralmente representa uma área separada
    com informações específicas.
-->
<div class="card">

<!--
    Título secundário.

    h2 representa uma seção dentro da página.

    Aqui identifica que esse card mostra o saldo.
-->
<h2>Saldo disponível</h2>

<!--
    Cria uma área onde será mostrado o saldo.

    id="saldo" é muito importante para o JavaScript.

    O JS pode buscar esse elemento:

    document.querySelector("#saldo")

    Depois alterar:
    elemento.textContent = "R$ 5000"
-->
<div id="saldo">
    R$ 10000.00
</div>

<!--
    Cria um parágrafo contendo informações da conta.

    class="info-conta":
    permite aplicar estilo CSS.
-->
<p class="info-conta">

<!--
    strong deixa o texto em negrito.

    id="numero-conta":
    permite acessar esse valor pelo JavaScript.

    Exemplo:

    document.querySelector("#numero-conta")
-->
Conta <strong id="numero-conta">1</strong>

<!--
    &nbsp;

    Representa um espaço em branco especial no HTML.

    Usado para criar espaçamento.
-->
—
<!--
    Mostra o nome do titular.

    strong:
    deixa em destaque.

    id="titular":
    permite o JavaScript alterar o nome.

    Exemplo:

    elTitular.textContent = "Marcos"
-->
<strong id="titular">
    Diego
</strong>


<!--
    span cria um pequeno bloco de texto.

    É usado aqui para mostrar o status da conta.
-->
<span 
    id="status-conta" 
    class="status-ativa">
    
    Ativa

</span>



</p>

<!--
    Fecha o card de saldo.
-->
</div>

  
<!-- ================================================= -->
<!-- CARD DE OPERAÇÕES -->
<!-- ================================================= -->

<!--
    Cria outro cartão da página.

    Esse card será responsável pelas ações:
    - alterar titular;
    - depositar;
    - sacar;
    - bloquear conta;
    - limpar histórico.
-->
<div class="card">

<!--
    Campo de texto para alterar o nome do titular.

    type="text":
    define que o campo recebe texto.

    id="titular-alterar":
    identifica o campo para o JavaScript.

    O JS usa:

    document.querySelector("#titular-alterar")

    placeholder:
    texto de orientação que aparece dentro do campo
    enquanto nada foi digitado.

    style:
    aplica CSS diretamente no HTML.

    width:
    define largura do campo.

    padding:
    cria espaço interno dentro do campo.
-->
<input 
    type="text" 
    id="titular-alterar" 
    placeholder="Alterar Titular" 
    style="width: 150px; padding: 10px;">

<!--
    Botão usado para alterar o titular.

    id="btn-alterar":
    permite que o JavaScript encontre esse botão.

    Exemplo:

    const btnalterar =
    document.querySelector("#btn-alterar")

    style="padding:15px":
    cria espaço interno no botão.
-->
<button 
    id="btn-alterar" 
    style="padding: 15px;">

    Alterar

</button>

<!--
    Cria uma quebra de linha.

    <br> pula uma linha.

    O <p> está sendo usado apenas
    para criar espaçamento.
-->
<p>
    <br/>
</p>


<!--
    Título da área de operações.
-->
<h2>
    Operações
</h2>


<!--
    Campo onde o usuário digita valores
    para depósito ou saque.

    type="number":
    aceita somente números.

    id="campo-valor":
    será usado pelo JavaScript.

    Exemplo:

    const valor =
    Number(document.querySelector("#campo-valor").value)


    placeholder:
    mostra uma dica ao usuário.


    min="0":
    impede valores menores que zero.


    step="0.01":
    permite valores com duas casas decimais.

    Exemplo:

    100
    100.50
    250.99
-->
<input 
    type="number" 
    id="campo-valor" 
    placeholder="Digite o valor (ex: 200.00)" 
    min="0" 
    step="0.01">

<!--
    Cria uma divisão para agrupar os botões.

    class="botoes":
    permite aplicar CSS nesse grupo.

    Exemplo:

    colocar lado a lado;
    criar espaçamento;
    ajustar tamanho.
-->
<div class="botoes">

<!--
    Botão responsável pelo depósito.

    id="btn-depositar":

    O JavaScript usa esse ID:

    const btnDepositar =
    document.querySelector("#btn-depositar")


    Depois adiciona um evento:

    btnDepositar.addEventListener(
        "click",
        depositar
    )

    O símbolo ⬆ é apenas visual.
-->
<button id="btn-depositar">

    ⬆ Depositar

</button>

<!--
    Botão responsável pelo saque.

    id="btn-sacar":

    Permite o JavaScript controlar
    o clique desse botão.

    Exemplo:

    btnSacar.addEventListener(
        "click",
        sacar
    )
-->
<button id="btn-sacar">

    ⬇ Sacar

</button>



</div>

<!--
    Área onde aparecem mensagens para o usuário.

    Inicialmente está vazia.

    O JavaScript altera:

    texto:
    element.textContent

    aparência:
    classList

    Exemplo:

    Sucesso:
    "Depósito realizado!"

    Erro:
    "Saldo insuficiente!"
-->
<div id="mensagem"></div>

<!--
    Botão para bloquear ou desbloquear a conta.

    id="btn-bloquear":

    O JavaScript usa:

    document.querySelector(
        "#btn-bloquear"
    )

    Quando clicado chama:

    bloquearConta()

    O emoji 🔒 é apenas decoração.
-->
<button id="btn-bloquear">

    🔒 Bloquear conta

</button>

<!--
    Espaçamento vertical usando quebra de linha.
-->
<p>
    <br/>
</p>

<!--
    Botão para apagar o histórico.

    id="btn-limpar":

    Será usado pelo JavaScript:

    btnLimpar.addEventListener(
        "click",
        limpar
    )

    Ele remove:
    - lista de transações;
    - informações antigas.
-->
<button id="btn-limpar">

    Limpar Histórico

</button>

<!--
    Fecha o Card de Operações.
-->
</div>

   <!-- ================================================= -->
<!-- CARD DE HISTÓRICO -->
<!-- ================================================= -->

<!--
    Cria um novo cartão visual.

    Esse card será responsável por mostrar
    as últimas movimentações da conta.

    A classe "card" será estilizada pelo CSS.
-->
<div class="card">

<!--
    Título da seção de histórico.

    h2 representa um título secundário.
-->
<h2>
    Últimas transações
</h2>

<!--
    Lista não ordenada.

    ul significa:
    unordered list (lista sem ordem).

    Ela será preenchida dinamicamente pelo JavaScript.

    Exemplo:

    Depósito: R$ 500
    Saque: R$ 200
    Depósito: R$ 100
-->
<ul id="lista-historico">

<!--
    Item inicial da lista.

    li significa:
    list item (item da lista).

    class="historico-vazio":
    identifica que essa mensagem
    aparece quando não existem transações.

    O JavaScript remove esse item
    quando uma primeira operação acontece.
-->
<li class="historico-vazio">

    Nenhuma transação ainda.

</li>




</ul>

<!--
    Fecha o card de histórico.
-->
</div>


<!-- ================================================= -->
<!-- CARD DE RESUMO -->
<!-- ================================================= -->

<!--
    Cria outro cartão visual.

    Esse card apresenta
    informações resumidas da conta.
-->
<div class="card">

<!--
    Título da seção de resumo.
-->
<h2>
    Resumo
</h2>

<!--
    Cria uma área para organizar
    os indicadores do resumo.

    class="resumo-grid":

    Normalmente será usada no CSS
    para criar uma grade.

    Exemplo:

    ------------------------
    | Depósitos | Saques |
    |    5      |   3    |
    ------------------------
-->
<div class="resumo-grid">

<!--
    Primeiro bloco de informação.

    class="resumo-item":

    Cada item do resumo terá
    seu próprio estilo.
-->
<div class="resumo-item">

<!--
    Mostra a quantidade de depósitos.

    id="total-depositos":

    O JavaScript altera esse valor.

    Exemplo:

    Antes:
    0

    Depois:
    5

    Código JavaScript:

    elTotalDepositos.textContent = 5
-->
<span id="total-depositos">

    0

</span>

<!--
    Texto identificando o número acima.
-->
<span>

    Depósitos

</span>

<!--
    Fecha o primeiro item do resumo.
-->
</div>

<!--
    Segundo item do resumo.

    Mostra quantidade de saques.
-->
<div class="resumo-item">

<!--
    Valor que será atualizado pelo JavaScript.

    Exemplo:

    0  →  10
-->
<span id="total-saques">

    0

</span>

<!--
    Nome do indicador.
-->
<span>

    Saques

</span>




</div>

<!--
    Terceiro item do resumo.

    Mostra o total de operações realizadas.
-->
<div class="resumo-item">





<!--
    Valor atualizado pelo JavaScript.

    Conta:

    depósitos + saques
-->
<span id="total-transacoes">

    0

</span>




<!--
    Nome do indicador.
-->
<span>

    Total

</span>




</div>




<!--
    Fecha a grade do resumo.
-->
</div>




<!--
    Fecha o card de resumo.
-->
</div>

<!--
    Fecha o container principal.

    Esse container engloba:

    - Card de saldo;
    - Card de operações;
    - Card de histórico;
    - Card de resumo.
-->
</div>

<!-- ================================================= -->
<!-- CONEXÃO COM JAVASCRIPT -->
<!-- ================================================= -->


<!--
    Carrega o arquivo JavaScript externo.

    src="banco.js":

    O navegador procura um arquivo chamado:

    banco.js

    Esse arquivo contém:

    - funções de depósito;
    - função de saque;
    - bloqueio de conta;
    - atualização do DOM;
    - eventos dos botões.

    É recomendado colocar o script
    no final do body para:

    1. O HTML carregar primeiro;
    2. O JavaScript encontrar os elementos.
-->
<script src="banco.js"></script>





<!--
    Fecha o body.

    Tudo que aparece visualmente
    na página está dentro dele.
-->
</body>


<!--
    Fecha o documento HTML.
-->
</html>
