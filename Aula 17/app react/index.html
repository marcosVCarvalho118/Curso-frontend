<!doctype html>
<!-- Informa ao navegador que o documento utiliza HTML5. -->

<html lang="en">
<!-- Início do documento HTML.
Define o idioma da página como inglês ("en"). -->

<head>
<!-- Contém as configurações da página. -->

<meta charset="UTF-8" />
<!-- Define a codificação UTF-8, permitindo o uso de caracteres especiais. -->

<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<!-- Define o ícone (favicon) exibido na aba do navegador. -->

<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- Faz a página se adaptar corretamente a celulares, tablets e computadores. -->

<title>app-react</title>
<!-- Define o título exibido na aba do navegador. -->

</head>

<body>
<!-- Início da parte visível da página. -->

<div id="root"></div>
<!-- Elemento onde a aplicação React será carregada.
O React insere todos os componentes dentro desta div. -->

<script type="module" src="/src/main.jsx"></script>
<!-- Importa o arquivo principal da aplicação React.
O atributo type="module" permite utilizar import e export do JavaScript moderno. -->

</body>
<!-- Fim da parte visível da página. -->

</html>
<!-- Fim do documento HTML. -->
