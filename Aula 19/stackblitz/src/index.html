<!DOCTYPE html>
<!-- Informa ao navegador que o documento utiliza HTML5. -->

<html lang="en">
<!-- Início do documento HTML.
Define o idioma da página como inglês ("en"). -->

<head>
<!-- Contém as configurações e informações da página. -->

<title>My app</title>
<!-- Define o título exibido na aba do navegador. -->

<meta charset="UTF-8" />
<!-- Define a codificação UTF-8, permitindo o uso de caracteres especiais. -->

<base href="/">
<!-- Define a URL base da aplicação.
Todos os caminhos relativos serão considerados a partir da raiz (/). -->

<meta property="og:image" content="https://bolt.new/static/og_default.png" />
<!-- Define a imagem de pré-visualização quando o link é compartilhado
em redes sociais que utilizam o protocolo Open Graph, como Facebook e LinkedIn. -->

<meta name="twitter:card" content="summary_large_image" />
<!-- Define que, ao compartilhar o link no Twitter (X),
será exibido um cartão com imagem grande. -->

<meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
<!-- Define a imagem que será exibida na pré-visualização do link no Twitter (X). -->

</head>

<body>
<!-- Início da parte visível da página. -->

<app-root>Loading...</app-root>
<!-- Elemento raiz da aplicação.
Frameworks como Angular utilizam essa tag para carregar toda a aplicação.
Enquanto a aplicação é carregada, o texto "Loading..." é exibido ao usuário. -->

</body>
<!-- Fim da parte visível da página. -->

</html>
<!-- Fim do documento HTML. -->
